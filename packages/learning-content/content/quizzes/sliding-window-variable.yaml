title: Check your understanding
passPercent: 70
questions:
  - kind: single
    prompt: "For the shortest valid window, where do you record the answer?"
    options:
      - "After the shrinking loop ends"
      - "Inside the shrinking loop, while the window is valid"
      - "Before the loop starts"
    answer: 1
    explanation: "While the window is valid, record its length, then shrink to try for something shorter."
  - kind: single
    prompt: "Why does the minimum size subarray sum window need all positive numbers?"
    options:
      - "It makes the code shorter"
      - "Adding always increases the sum and removing always decreases it, so shrinking is meaningful"
      - "Negative numbers are not allowed in JavaScript"
    answer: 1
    explanation: "With negative numbers the sum can go up or down in either direction, so a window cannot be adjusted deterministically."
  - kind: multiple
    prompt: "Which statements about the variable window technique are true?"
    options:
      - "Both pointers only move forward"
      - "The whole scan is O(n)"
      - "You must use a for loop for left and a for loop for right nested inside each other"
      - "Use a while loop for shrinking because the window may need to shrink several times"
    answer: [0, 1, 3]
    explanation: "The shrinking is a while loop inside the outer loop, but because left never moves backwards, the total work is still linear."
  - kind: true-false
    prompt: "Longest Repeating Character Replacement is valid when window length minus the count of its most frequent letter is at most k."
    answer: true
    explanation: "The other letters are the ones you would replace, and you may replace at most k of them."
