title: Check your understanding
passPercent: 70
questions:
  - kind: single
    prompt: "What is the ping-pong rule in small talk?"
    options:
      - "Answer the question, add a detail and ask the same question back"
      - "Answer with one word"
      - "Ask five questions without answering"
    answer: 0
    explanation: "Small talk works like table tennis: you hit the question back, so the conversation continues."
  - kind: single
    prompt: "Which topic is the safest at work?"
    options:
      - "Your colleague's salary"
      - "Politics"
      - "Weekend plans"
    answer: 2
    explanation: "Weekend plans, food, travel and hobbies are light and safe. Avoid salary, religion and politics."
  - kind: multiple
    prompt: "Select all the polite ways to end a conversation."
    options:
      - "It was nice talking to you."
      - "I should get back to work. Let's catch up later."
      - "Okay, bye. You talk too much."
      - "I think we're about to start. Talk to you later."
    answer: [0, 1, 3]
    explanation: "These phrases are friendly and give a reason for leaving."
  - kind: true-false
    prompt: "One-word answers such as 'fine' are the best way to keep a conversation going."
    answer: false
    explanation: "One-word answers end the conversation. Add a detail and ask a question back."
