slug: search-insert-position
title: Search Insert Position
difficulty: easy
topics: [arrays, binary-search]
lesson: binary-search-basics
function: searchInsert
statement: |
  Given a sorted array of **distinct** integers `nums` and an integer `target`, return the index of `target` if it is found. If it is not found, return the index where it would be inserted to keep the array sorted.

  You must write an algorithm with `O(log n)` runtime complexity.
constraints: |
  - `1 <= nums.length <= 10^4`
  - `-10^4 <= nums[i], target <= 10^4`
  - `nums` contains distinct values sorted in ascending order
examples:
  - input: "nums = [1, 3, 5, 6], target = 5"
    output: "2"
  - input: "nums = [1, 3, 5, 6], target = 2"
    output: "1"
    explanation: "2 would be inserted between 1 and 3, at index 1."
  - input: "nums = [1, 3, 5, 6], target = 7"
    output: "4"
    explanation: "7 would be inserted at the end."
starter: |
  function searchInsert(nums: number[], target: number): number {
    return 0;
  }
tests:
  - { args: [[1, 3, 5, 6], 5], expected: 2 }
  - { args: [[1, 3, 5, 6], 2], expected: 1 }
  - { args: [[1, 3, 5, 6], 7], expected: 4 }
  - { args: [[1, 3, 5, 6], 0], expected: 0, hidden: true }
  - { args: [[1], 1], expected: 0, hidden: true }
  - { args: [[1], 2], expected: 1, hidden: true }
  - { args: [[1, 3], 3], expected: 1, hidden: true }
  - { args: [[2, 4, 6, 8, 10], 9], expected: 4, hidden: true }
hints:
  - "This is binary search where a miss still gives a useful answer."
  - "You are looking for the first index whose value is greater than or equal to `target` (a lower bound)."
  - "Keep `left = 0` and `right = nums.length`. While `left < right`, if `nums[mid] < target` set `left = mid + 1`, otherwise `right = mid`. Return `left`."
solution:
  code: |
    function searchInsert(nums: number[], target: number): number {
      let left = 0;
      let right = nums.length;
      while (left < right) {
        const mid = left + Math.floor((right - left) / 2);
        if (nums[mid] < target) left = mid + 1;
        else right = mid;
      }
      return left;
    }
  explanation: |
    The insert position is the first index whose value is not smaller than the target, which is called a lower bound. Use a half-open range `[left, right)`. If the middle value is smaller than the target, everything up to and including it is too small, so move `left` past it. Otherwise the answer is at `mid` or to its left, so set `right = mid`. When the range is empty, `left` is the answer.
  time: O(log n)
  space: O(1)
