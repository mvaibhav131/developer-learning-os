slug: subarray-sum-equals-k
title: Subarray Sum Equals K
difficulty: medium
topics: [arrays, prefix-sum, hash-map]
lesson: prefix-sum-hashmap
function: subarraySum
statement: |
  Given an integer array `nums` and an integer `k`, return the **number of contiguous subarrays** whose sum equals `k`.

  The array can contain negative numbers and zeros, so a sliding window will not work.
constraints: |
  - `1 <= nums.length <= 2 * 10^4`
  - `-1000 <= nums[i] <= 1000`
  - `-10^7 <= k <= 10^7`
examples:
  - input: "nums = [1, 1, 1], k = 2"
    output: "2"
    explanation: "The subarrays [1, 1] at positions 0-1 and 1-2 both sum to 2."
  - input: "nums = [1, 2, 3], k = 3"
    output: "2"
    explanation: "[1, 2] and [3]."
starter: |
  function subarraySum(nums: number[], k: number): number {
    return 0;
  }
tests:
  - { args: [[1, 1, 1], 2], expected: 2 }
  - { args: [[1, 2, 3], 3], expected: 2 }
  - { args: [[1], 0], expected: 0 }
  - { args: [[1, -1, 0], 0], expected: 3, hidden: true }
  - { args: [[0, 0, 0], 0], expected: 6, hidden: true }
  - { args: [[3, 4, 7, 2, -3, 1, 4, 2], 7], expected: 4, hidden: true }
  - { args: [[-1, -1, 1], 0], expected: 1, hidden: true }
  - { args: [[1, 2, 1, 2, 1], 3], expected: 4, hidden: true }
hints:
  - "Checking every subarray is O(n^2). Think in terms of prefix sums."
  - "The sum of nums[i..j] equals prefix[j] - prefix[i-1]. You want that difference to be `k`."
  - "While scanning, store how many times each prefix sum has occurred in a Map (start with `0 -> 1`). For the current prefix `p`, add `map.get(p - k)` to the answer."
solution:
  code: |
    function subarraySum(nums: number[], k: number): number {
      const seen = new Map<number, number>([[0, 1]]);
      let prefix = 0;
      let count = 0;
      for (const value of nums) {
        prefix += value;
        count += seen.get(prefix - k) ?? 0;
        seen.set(prefix, (seen.get(prefix) ?? 0) + 1);
      }
      return count;
    }
  explanation: |
    A subarray ending at the current index sums to `k` exactly when some earlier prefix sum equals `currentPrefix - k`. Keep a map of how many times each prefix sum has occurred, seeded with the empty prefix (sum 0, count 1). At each element add the number of matching earlier prefixes to the answer, then record the current prefix. This handles negative numbers and zeros, which break sliding windows.
  time: O(n)
  space: O(n)
