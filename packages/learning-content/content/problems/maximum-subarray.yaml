slug: maximum-subarray
title: Maximum Subarray
difficulty: medium
topics: [arrays, kadane, dynamic-programming]
lesson: array-interview-patterns
function: maxSubArray
statement: |
  Given an integer array `nums`, find the **contiguous** subarray (at least one element) with the largest sum and return that sum.
constraints: |
  - `1 <= nums.length <= 10^5`
  - `-10^4 <= nums[i] <= 10^4`
examples:
  - input: "nums = [-2, 1, -3, 4, -1, 2, 1, -5, 4]"
    output: "6"
    explanation: "The subarray [4, -1, 2, 1] has the largest sum, 6."
  - input: "nums = [1]"
    output: "1"
starter: |
  function maxSubArray(nums: number[]): number {
    return 0;
  }
tests:
  - { args: [[-2, 1, -3, 4, -1, 2, 1, -5, 4]], expected: 6 }
  - { args: [[1]], expected: 1 }
  - { args: [[5, 4, -1, 7, 8]], expected: 23 }
  - { args: [[-1]], expected: -1, hidden: true }
  - { args: [[-2, -1]], expected: -1, hidden: true }
  - { args: [[-3, -2, -1, -4]], expected: -1, hidden: true }
  - { args: [[8, -19, 5, -4, 20]], expected: 21, hidden: true }
  - { args: [[1, -1, 1, -1, 1]], expected: 1, hidden: true }
hints:
  - "Checking every subarray is O(n^2) or worse. Think about the best subarray that ENDS at index i."
  - "If the best sum ending at the previous index is negative, it only hurts. Start fresh at the current element."
  - "Keep `current = max(nums[i], current + nums[i])` and track the largest `current` ever seen. This is Kadane's algorithm."
solution:
  code: |
    function maxSubArray(nums: number[]): number {
      let current = nums[0];
      let best = nums[0];
      for (let i = 1; i < nums.length; i++) {
        current = Math.max(nums[i], current + nums[i]);
        best = Math.max(best, current);
      }
      return best;
    }
  explanation: |
    Let `current` be the best sum of a subarray that ends at the current index. Either extend the previous subarray (`current + nums[i]`) or start a new one at `nums[i]`, whichever is larger. The answer is the largest `current` seen. Starting from `nums[0]` instead of 0 keeps arrays of only negative numbers correct.
  time: O(n)
  space: O(1)
