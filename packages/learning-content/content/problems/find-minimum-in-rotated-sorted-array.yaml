slug: find-minimum-in-rotated-sorted-array
title: Find Minimum in Rotated Sorted Array
difficulty: medium
topics: [arrays, binary-search]
lesson: binary-search-basics
function: findMin
statement: |
  An array of **unique** integers that was sorted in ascending order has been **rotated** between 1 and `n` times. For example, `[0, 1, 2, 4, 5, 6, 7]` rotated four times becomes `[4, 5, 6, 7, 0, 1, 2]`.

  Given the rotated array `nums`, return its **minimum element**. You must write an algorithm that runs in `O(log n)` time.
constraints: |
  - `1 <= nums.length <= 5000`
  - `-5000 <= nums[i] <= 5000`
  - All values are unique
examples:
  - input: "nums = [3, 4, 5, 1, 2]"
    output: "1"
    explanation: "The original array was [1, 2, 3, 4, 5], rotated 3 times."
  - input: "nums = [11, 13, 15, 17]"
    output: "11"
    explanation: "Rotating n times gives the original sorted array."
starter: |
  function findMin(nums: number[]): number {
    return 0;
  }
tests:
  - { args: [[3, 4, 5, 1, 2]], expected: 1 }
  - { args: [[4, 5, 6, 7, 0, 1, 2]], expected: 0 }
  - { args: [[11, 13, 15, 17]], expected: 11 }
  - { args: [[1]], expected: 1, hidden: true }
  - { args: [[2, 1]], expected: 1, hidden: true }
  - { args: [[5, 1, 2, 3, 4]], expected: 1, hidden: true }
  - { args: [[2, 3, 4, 5, 1]], expected: 1, hidden: true }
  - { args: [[1, 2, 3]], expected: 1, hidden: true }
hints:
  - "A linear scan is O(n). The array is made of two sorted pieces; the minimum is where the second piece starts."
  - "Compare `nums[mid]` with `nums[right]`. If `nums[mid] > nums[right]`, the minimum is to the right of mid."
  - "Otherwise the minimum is at mid or to its left, so set `right = mid`. When `left === right`, that index is the minimum."
solution:
  code: |
    function findMin(nums: number[]): number {
      let left = 0;
      let right = nums.length - 1;
      while (left < right) {
        const mid = left + Math.floor((right - left) / 2);
        if (nums[mid] > nums[right]) left = mid + 1;
        else right = mid;
      }
      return nums[left];
    }
  explanation: |
    In a rotated sorted array, if the middle element is larger than the last element, the drop (and the minimum) must lie to the right of the middle. Otherwise the right half is sorted, so the minimum is at the middle or to its left. Each step halves the range, and when it shrinks to a single index that element is the minimum.
  time: O(log n)
  space: O(1)
