slug: contains-duplicate
title: Contains Duplicate
difficulty: easy
topics: [arrays, hash-set]
lesson: sets-and-deduplication
function: containsDuplicate
statement: |
  Given an integer array `nums`, return `true` if any value appears **at least twice**, and `false` if every element is distinct.
constraints: |
  - `1 <= nums.length <= 10^5`
  - `-10^9 <= nums[i] <= 10^9`
examples:
  - input: "nums = [1, 2, 3, 1]"
    output: "true"
    explanation: "The value 1 appears twice."
  - input: "nums = [1, 2, 3, 4]"
    output: "false"
    explanation: "Every element is distinct."
starter: |
  function containsDuplicate(nums: number[]): boolean {
    return false;
  }
tests:
  - { args: [[1, 2, 3, 1]], expected: true }
  - { args: [[1, 2, 3, 4]], expected: false }
  - { args: [[1, 1, 1, 3, 3, 4, 3, 2, 4, 2]], expected: true }
  - { args: [[1]], expected: false, hidden: true }
  - { args: [[0, 0]], expected: true, hidden: true }
  - { args: [[-1, -2, -3, -1]], expected: true, hidden: true }
  - { args: [[1000000000, -1000000000, 7]], expected: false, hidden: true }
hints:
  - "Comparing every pair works but takes O(n^2). What do you need to ask for each number?"
  - "The question is: have I seen this value before? A Set answers that in constant time."
  - "Return true as soon as a value is already in the set. Otherwise add it and continue."
solution:
  code: |
    function containsDuplicate(nums: number[]): boolean {
      const seen = new Set<number>();
      for (const value of nums) {
        if (seen.has(value)) return true;
        seen.add(value);
      }
      return false;
    }
  explanation: |
    Keep a set of the values you have already passed. If the current value is already in the set, a duplicate exists and you can stop early. Otherwise add it and move on. One pass with constant-time set operations gives O(n) time at the cost of O(n) extra space.
  time: O(n)
  space: O(n)
