slug: two-sum-sorted
title: Two Sum II - Sorted Input
difficulty: medium
topics: [arrays, two-pointers]
lesson: two-pointers-opposite-ends
function: twoSumSorted
statement: |
  Given a **1-indexed** array of integers `numbers` that is already sorted in non-decreasing order, find two numbers that add up to `target`.

  Return their positions as `[index1, index2]` with `1 <= index1 < index2 <= numbers.length`. Exactly one solution exists, you may not use the same element twice, and you must use only **constant extra space**.
constraints: |
  - `2 <= numbers.length <= 3 * 10^4`
  - `-1000 <= numbers[i] <= 1000`
  - `numbers` is sorted in non-decreasing order
  - Exactly one solution exists
examples:
  - input: "numbers = [2, 7, 11, 15], target = 9"
    output: "[1, 2]"
    explanation: "2 + 7 = 9, so the positions are 1 and 2."
  - input: "numbers = [-1, 0], target = -1"
    output: "[1, 2]"
starter: |
  function twoSumSorted(numbers: number[], target: number): number[] {
    return [];
  }
tests:
  - { args: [[2, 7, 11, 15], 9], expected: [1, 2] }
  - { args: [[2, 3, 4], 6], expected: [1, 3] }
  - { args: [[-1, 0], -1], expected: [1, 2] }
  - { args: [[1, 2, 3, 4, 4, 9, 56, 90], 8], expected: [4, 5], hidden: true }
  - { args: [[5, 25, 75], 100], expected: [2, 3], hidden: true }
  - { args: [[-5, -3, 0, 3, 8], 0], expected: [2, 4], hidden: true }
  - { args: [[1, 3, 4, 5, 7, 10, 11], 9], expected: [3, 4], hidden: true }
hints:
  - "A hash map solves it, but the array is sorted and you may only use constant extra space."
  - "Start with one pointer at each end. Look at their sum."
  - "If the sum is too small, move the left pointer right to get a bigger number. If it is too big, move the right pointer left."
solution:
  code: |
    function twoSumSorted(numbers: number[], target: number): number[] {
      let left = 0;
      let right = numbers.length - 1;
      while (left < right) {
        const sum = numbers[left] + numbers[right];
        if (sum === target) return [left + 1, right + 1];
        if (sum < target) left++;
        else right--;
      }
      return [];
    }
  explanation: |
    Because the array is sorted, the sum of the two pointers tells you which way to move. A sum that is too small can only grow by advancing the left pointer, and a sum that is too large can only shrink by pulling back the right pointer. Every step discards at least one candidate for good, so the scan is linear and uses no extra memory.
  time: O(n)
  space: O(1)
