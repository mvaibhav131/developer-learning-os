slug: first-unique-character
title: First Unique Character in a String
difficulty: easy
topics: [strings, hash-map, frequency-counting]
lesson: hashmaps-and-frequency-counting
function: firstUniqChar
statement: |
  Given a string `s`, find the **first character that does not repeat** and return its index. If every character repeats, return `-1`.
constraints: |
  - `1 <= s.length <= 10^5`
  - `s` consists of lowercase English letters
examples:
  - input: 's = "leetcode"'
    output: "0"
    explanation: 'The character "l" appears once and comes first.'
  - input: 's = "loveleetcode"'
    output: "2"
    explanation: 'The character "v" is the first one that appears only once.'
starter: |
  function firstUniqChar(s: string): number {
    return -1;
  }
tests:
  - { args: ["leetcode"], expected: 0 }
  - { args: ["loveleetcode"], expected: 2 }
  - { args: ["aabb"], expected: -1 }
  - { args: ["z"], expected: 0, hidden: true }
  - { args: ["aadadaad"], expected: -1, hidden: true }
  - { args: ["abcabcd"], expected: 6, hidden: true }
  - { args: ["dddccdbba"], expected: 8, hidden: true }
hints:
  - "Checking each character against the whole string is O(n^2)."
  - "First pass: count how many times each character appears."
  - "Second pass: scan the string again and return the first index whose character has a count of 1."
solution:
  code: |
    function firstUniqChar(s: string): number {
      const counts = new Map<string, number>();
      for (const ch of s) counts.set(ch, (counts.get(ch) ?? 0) + 1);
      for (let i = 0; i < s.length; i++) {
        if (counts.get(s[i]) === 1) return i;
      }
      return -1;
    }
  explanation: |
    Counting first and scanning second separates "how often does each letter appear" from "which one comes first". The first pass fills a frequency map. The second pass walks the string in order and returns the first index whose count is exactly one. Both passes are linear.
  time: O(n)
  space: O(1) for a fixed alphabet
