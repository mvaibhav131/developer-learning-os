slug: two-sum
title: Two Sum
difficulty: easy
topics: [arrays, hash-map]
lesson: hashing-interview-patterns
function: twoSum
ordering: any-order
statement: |
  Given an array of integers `nums` and an integer `target`, return the **indices** of the two numbers whose sum equals `target`.

  Exactly one valid pair exists in every input, and you may not use the same element twice. The answer can be returned in any order.
constraints: |
  - `2 <= nums.length <= 10^4`
  - `-10^9 <= nums[i] <= 10^9`
  - Exactly one pair of indices adds up to `target`
examples:
  - input: "nums = [2, 7, 11, 15], target = 9"
    output: "[0, 1]"
    explanation: "nums[0] + nums[1] = 2 + 7 = 9."
  - input: "nums = [3, 2, 4], target = 6"
    output: "[1, 2]"
    explanation: "The same element cannot be used twice, so [0, 0] is not allowed."
starter: |
  function twoSum(nums: number[], target: number): number[] {
    // Return the two indices.
    return [];
  }
tests:
  - { args: [[2, 7, 11, 15], 9], expected: [0, 1] }
  - { args: [[3, 2, 4], 6], expected: [1, 2] }
  - { args: [[3, 3], 6], expected: [0, 1] }
  - { args: [[-1, -2, -3, -4, -5], -8], expected: [2, 4], hidden: true }
  - { args: [[0, 4, 3, 0], 0], expected: [0, 3], hidden: true }
  - { args: [[1, 5, 8, 12, 20, 7], 27], expected: [4, 5], hidden: true }
  - { args: [[1000000000, -1000000000, 5], 0], expected: [0, 1], hidden: true }
hints:
  - "Brute force checks every pair in O(n^2). Which question does the inner loop ask?"
  - "For each number x you need exactly one partner: target - x. Can you find a partner without scanning?"
  - "Store each value you have already passed in a Map (value -> index). Look up the partner before you store the current number."
solution:
  code: |
    function twoSum(nums: number[], target: number): number[] {
      const seen = new Map<number, number>();
      for (let i = 0; i < nums.length; i++) {
        const j = seen.get(target - nums[i]);
        if (j !== undefined) return [j, i];
        seen.set(nums[i], i);
      }
      return [];
    }
  explanation: |
    Walk the array once and remember every value with its index. For the current number, the partner you need is `target - nums[i]`. If it is already in the map, you have the answer. Otherwise store the current number and continue. Looking up before storing guarantees that an element is never paired with itself.
  time: O(n)
  space: O(n)
