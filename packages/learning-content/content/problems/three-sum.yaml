slug: three-sum
title: 3Sum
difficulty: medium
topics: [arrays, two-pointers, sorting]
lesson: two-pointers-opposite-ends
function: threeSum
ordering: any-order-groups
statement: |
  Given an integer array `nums`, return all the **unique triplets** `[nums[i], nums[j], nums[k]]` with distinct indices `i`, `j`, `k` such that `nums[i] + nums[j] + nums[k] == 0`.

  The solution must not contain duplicate triplets. The order of the triplets, and of the numbers inside a triplet, does not matter.
constraints: |
  - `3 <= nums.length <= 3000`
  - `-10^5 <= nums[i] <= 10^5`
examples:
  - input: "nums = [-1, 0, 1, 2, -1, -4]"
    output: "[[-1, -1, 2], [-1, 0, 1]]"
    explanation: "The two triplets sum to 0, and the two -1 values are interchangeable so each triplet appears once."
  - input: "nums = [0, 1, 1]"
    output: "[]"
starter: |
  function threeSum(nums: number[]): number[][] {
    return [];
  }
tests:
  - { args: [[-1, 0, 1, 2, -1, -4]], expected: [[-1, -1, 2], [-1, 0, 1]] }
  - { args: [[0, 1, 1]], expected: [] }
  - { args: [[0, 0, 0]], expected: [[0, 0, 0]] }
  - { args: [[-2, 0, 1, 1, 2]], expected: [[-2, 0, 2], [-2, 1, 1]], hidden: true }
  - { args: [[0, 0, 0, 0]], expected: [[0, 0, 0]], hidden: true }
  - { args: [[-1, -1, -1, 2, 2]], expected: [[-1, -1, 2]], hidden: true }
  - { args: [[-4, -2, -2, -2, 0, 1, 2, 2, 2, 3, 3, 4, 4, 6, 6]], expected: [[-4, -2, 6], [-4, 0, 4], [-4, 1, 3], [-4, 2, 2], [-2, -2, 4], [-2, 0, 2]], hidden: true }
hints:
  - "Three nested loops are O(n^3) and produce duplicates. Sort the array first."
  - "Fix the first number, then solve Two Sum on the rest with two pointers (the remaining part is sorted)."
  - "Skip equal neighbours: for the first number, and for the left and right pointers after you record a triplet. That removes duplicates without a Set."
solution:
  code: |
    function threeSum(nums: number[]): number[][] {
      const sorted = [...nums].sort((a, b) => a - b);
      const result: number[][] = [];
      for (let i = 0; i < sorted.length - 2; i++) {
        if (sorted[i] > 0) break;
        if (i > 0 && sorted[i] === sorted[i - 1]) continue;
        let left = i + 1;
        let right = sorted.length - 1;
        while (left < right) {
          const sum = sorted[i] + sorted[left] + sorted[right];
          if (sum < 0) left++;
          else if (sum > 0) right--;
          else {
            result.push([sorted[i], sorted[left], sorted[right]]);
            left++;
            right--;
            while (left < right && sorted[left] === sorted[left - 1]) left++;
            while (left < right && sorted[right] === sorted[right + 1]) right--;
          }
        }
      }
      return result;
    }
  explanation: |
    Sorting makes duplicates adjacent and lets you use two pointers. For each first number, search the rest of the array from both ends: a sum below zero moves the left pointer up, a sum above zero moves the right pointer down. After recording a triplet, skip over repeated values on both sides so the same triplet is never added twice. Sorting costs O(n log n) and the nested scan O(n^2).
  time: O(n^2)
  space: O(1) extra (besides the output and the sorted copy)
