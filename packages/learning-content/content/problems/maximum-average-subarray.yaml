slug: maximum-average-subarray
title: Maximum Average Subarray
difficulty: easy
topics: [arrays, sliding-window]
lesson: sliding-window-fixed
function: findMaxAverage
float: true
statement: |
  You are given an integer array `nums` and an integer `k`. Find the contiguous subarray of **exactly `k` elements** with the largest average value and return that average.

  Any answer with an error smaller than `10^-5` is accepted.
constraints: |
  - `1 <= k <= nums.length <= 10^5`
  - `-10^4 <= nums[i] <= 10^4`
examples:
  - input: "nums = [1, 12, -5, -6, 50, 3], k = 4"
    output: "12.75"
    explanation: "The window [12, -5, -6, 50] has sum 51, and 51 / 4 = 12.75."
  - input: "nums = [5], k = 1"
    output: "5"
starter: |
  function findMaxAverage(nums: number[], k: number): number {
    return 0;
  }
tests:
  - { args: [[1, 12, -5, -6, 50, 3], 4], expected: 12.75 }
  - { args: [[5], 1], expected: 5 }
  - { args: [[0, 4, 0, 3, 2], 1], expected: 4 }
  - { args: [[-1], 1], expected: -1, hidden: true }
  - { args: [[4, 2, 1, 3, 3], 2], expected: 3, hidden: true }
  - { args: [[1, 2, 3, 4, 5], 5], expected: 3, hidden: true }
  - { args: [[-5, -4, -3, -2], 2], expected: -2.5, hidden: true }
hints:
  - "The window size never changes. The best average is the best SUM, divided by k at the end."
  - "Compute the sum of the first k elements."
  - "Slide the window one step at a time: add the new element on the right and subtract the element that leaves on the left. Do not re-add all k numbers."
solution:
  code: |
    function findMaxAverage(nums: number[], k: number): number {
      let sum = 0;
      for (let i = 0; i < k; i++) sum += nums[i];
      let best = sum;
      for (let i = k; i < nums.length; i++) {
        sum += nums[i] - nums[i - k];
        best = Math.max(best, sum);
      }
      return best / k;
    }
  explanation: |
    With a fixed window size, the average is the window sum divided by `k`, so maximizing the sum is enough. Build the first window, then slide: add the entering element and subtract the leaving one. Each step is constant time, and dividing once at the end avoids repeated floating-point work.
  time: O(n)
  space: O(1)
videos: [uqGxFk0cEdI]
