packages:
  - apps/*
  - packages/*

# pnpm 10 blocks dependency install scripts by default. Only these need them:
# better-sqlite3 downloads/builds its native binding, esbuild fetches its platform binary.
onlyBuiltDependencies:
  - better-sqlite3
  - esbuild

# swagger-ui-dist pulls in @scarf/scarf, whose install script sends usage telemetry. Keep it blocked.
ignoredBuiltDependencies:
  - '@scarf/scarf'

# Single source of truth for versions shared by several workspace packages.
catalog:
  typescript: ~6.0.3
  vitest: ^5.0.5
  vite: ^8.3.4
  zod: ^4.6.7
  react: ^19.3.1
  react-dom: ^19.3.1
  lucide-react: ^1.59.0
  '@types/node': ^22.0.0
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
